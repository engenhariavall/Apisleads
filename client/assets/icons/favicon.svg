<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Profundo VERSUS -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <!-- Gradiente Tático do Monograma V -->
    <linearGradient id="versusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="60%" stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Gradiente de Acento do Braço Direito -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Glow Filtro -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com Cantos Suaves -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="rgba(0, 210, 255, 0.2)" stroke-width="2"/>

  <!-- Malha Tática Subjacente (Reticulado Sutil) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0, 85, 255, 0.08)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(0, 210, 255, 0.08)" stroke-width="1.5"/>

  <!-- Monograma V Geométrico Tático -->
  <g filter="url(#neonGlow)">
    <!-- Asa Esquerda do V -->
    <path d="M 120 128 L 220 128 L 256 360 L 210 360 Z" fill="url(#versusGrad)"/>
    <!-- Asa Direita do V -->
    <path d="M 392 128 L 292 128 L 256 360 L 302 360 Z" fill="url(#accentGrad)"/>
    <!-- Ponto Central Tático de Alvo / Radar -->
    <circle cx="256" cy="180" r="14" fill="#00D2FF"/>
    <circle cx="256" cy="180" r="26" fill="none" stroke="rgba(0, 210, 255, 0.4)" stroke-width="2"/>
  </g>
</svg>
